<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Todo</h1>

      <form action="/add" method="post" class="mb-4">
        <div class="input-group">
          <input name="title" class="form-control" placeholder="Add new todo" required>
          <button class="btn btn-primary" type="submit">Add</button>
        </div>
      </form>

      <ul class="list-group">
        {% for t in todos %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <a href="/toggle/{{ t.id }}" class="me-2">
              {% if t.done %}
                <span class="badge bg-success">Done</span>
              {% else %}
                <span class="badge bg-secondary">Todo</span>
              {% endif %}
            </a>
            <span style="text-decoration: {% if t.done %}line-through{% endif %};">{{ t.title }}</span>
          </div>
          <div>
            <a href="/delete/{{ t.id }}" class="btn btn-sm btn-outline-danger">Delete</a>
          </div>
        </li>
        {% else %}
        <li class="list-group-item">No todos yet.</li>
        {% endfor %}
      </ul>
    </div>
  </body>
</html>
